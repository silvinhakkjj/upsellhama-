<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tudo certo · Pixel Ateliê</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#FFF5EC;color:#2A1F3D;font-family:Nunito,Arial,sans-serif;font-size:16px;line-height:1.5}
  main{max-width:480px;margin:0 auto;padding:48px 18px;text-align:center}
  .logo{font-family:Fredoka,Arial;font-weight:700;font-size:20px;letter-spacing:1px;margin-bottom:26px}
  .logo span{color:#E8457A}
  .ok{width:64px;height:64px;border-radius:50%;background:#256B29;color:#fff;font-size:34px;line-height:64px;margin:0 auto 16px}
  h1{font-family:Fredoka,Arial;font-size:26px;margin-bottom:10px}
  p{color:#4A4060;margin-bottom:12px}
  .box{background:#fff;border:1px solid #EADFE8;border-radius:8px;padding:16px;margin-top:18px;text-align:left;font-size:15px}
  .box li{margin:0 0 8px 18px}
</style>
</head>
<body>
<main>
  <div class="logo">PIXEL <span>ATELIÊ</span></div>
  <div class="ok">✓</div>
  <h1>Tudo certo!</h1>
  <p>Seu acesso aos moldes já foi enviado no seu WhatsApp e no e-mail da compra.</p>
  <div class="box">
    <ol>
      <li>Abra a mensagem e toque no link de acesso.</li>
      <li>Não chegou no e-mail? Olhe também em Spam e Promoções.</li>
      <li>Comece por um molde fácil: cabe numa placa só.</li>
    </ol>
  </div>
</main>
</body>
</html>
